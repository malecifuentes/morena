<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <meta
      name="description"
      content="Browse Morena Bakery's product catalogue and pricing."
    >

    <title>Morena Bakery</title>

    <link
      rel="icon"
      type="image/jpeg"
      href="assets/images/logo-morena.jpg"
    >

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    >

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;display=swap"
      rel="stylesheet"
    >

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
      href="styles.css"
      rel="stylesheet"
    >

    <style>
      .chat-section {
        margin: 4rem 0 2rem;
        padding: 2rem;
        border: 1px solid #e7ded8;
        border-radius: 18px;
        background: #fffaf6;
      }

      .chat-header {
        margin-bottom: 1.5rem;
      }

      .chat-header h2 {
        margin-bottom: 0.5rem;
      }

      .chat-header p {
        margin-bottom: 0;
        color: #6f625c;
      }

      .chat-window {
        min-height: 180px;
        max-height: 380px;
        overflow-y: auto;
        padding: 1rem;
        margin-bottom: 1rem;
        border: 1px solid #e7ded8;
        border-radius: 14px;
        background: #ffffff;
      }

      .chat-message {
        margin-bottom: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        line-height: 1.5;
      }

      .chat-message-user {
        margin-left: 12%;
        background: #f2e8e3;
      }

      .chat-message-assistant {
        margin-right: 12%;
        background: #f8f6f4;
      }

      .chat-message strong {
        display: block;
        margin-bottom: 0.25rem;
      }

      .chat-form {
        display: flex;
        gap: 0.75rem;
      }

      .chat-form input {
        flex: 1;
      }

      .chat-status {
        margin-top: 0.75rem;
        margin-bottom: 0;
        font-size: 0.95rem;
        color: #6f625c;
      }

      @media (max-width: 576px) {
        .chat-section {
          padding: 1.25rem;
        }

        .chat-form {
          flex-direction: column;
        }

        .chat-message-user,
        .chat-message-assistant {
          margin-left: 0;
          margin-right: 0;
        }
      }
    </style>
  </head>

  <body>

    <header class="site-header">
      <div class="container page-width">

        <a
          class="brand"
          href="./"
          aria-label="Morena Bakery catalogue"
        >
          <img
            src="assets/images/logo-morena.jpg"
            alt="Morena Bakery"
          >
        </a>

        <a
          class="card-link"
          href="order.html"
        >
          <i
            class="bi bi-bag-heart"
            aria-hidden="true"
          ></i>
          Place an order
        </a>

      </div>
    </header>

    <main
      id="main-content"
      class="container page-width"
      tabindex="-1"
    >

      <section
        id="catalogue-view"
        aria-labelledby="catalogue-title"
      >

        <div class="catalogue-hero">
          <img
            src="assets/images/hero-morena.jpg"
            alt="Morena Bakery handcrafted cakes and pastries"
          >
        </div>

        <div class="intro">
          <p class="eyebrow">
            Baked with care
          </p>

          <h1 id="catalogue-title">
            Our catalogue
          </h1>

          <p>
            Choose something special from our bakery.
          </p>
        </div>

        <div
          id="catalogue"
          class="row g-4"
          aria-live="polite"
        ></div>

      </section>

      <section
        id="detail-view"
        class="d-none"
        aria-labelledby="product-name"
      >

        <a
          class="back-link"
          href="./"
          data-back
          aria-label="Back to product catalogue"
        >
          <i
            class="bi bi-arrow-left"
            aria-hidden="true"
          ></i>
          Back to catalogue
        </a>

        <div
          id="product-detail"
          aria-live="polite"
        ></div>

      </section>

      <section
        class="chat-section"
        aria-labelledby="chat-title"
      >
        <div class="chat-header">

          <p class="eyebrow">
            Need help?
          </p>

          <h2 id="chat-title">
            Ask Morena Bakery
          </h2>

          <p>
            Ask about our products, placing an order,
            or checking an order status.
          </p>

        </div>

        <div
          id="chat-window"
          class="chat-window"
          aria-live="polite"
        >
          <div class="chat-message chat-message-assistant">
            <strong>Morena Bakery</strong>
            Hi! How can I help you today?
          </div>
        </div>

        <form
          id="chat-form"
          class="chat-form"
        >
          <input
            id="chat-message"
            class="form-control"
            type="text"
            name="message"
            maxlength="1000"
            placeholder="Ask a question..."
            autocomplete="off"
            required
          >

          <button
            id="chat-submit"
            class="btn btn-dark"
            type="submit"
          >
            Send
          </button>
        </form>

        <p
          id="chat-status"
          class="chat-status"
          role="status"
        ></p>

      </section>

    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="app.js"></script>

    <script>
      const chatForm = document.getElementById("chat-form");
      const chatMessageField =
        document.getElementById("chat-message");
      const chatWindow =
        document.getElementById("chat-window");
      const chatStatus =
        document.getElementById("chat-status");
      const chatSubmit =
        document.getElementById("chat-submit");

      function addChatMessage(role, message) {
        const messageElement =
          document.createElement("div");

        messageElement.className =
          role === "user"
            ? "chat-message chat-message-user"
            : "chat-message chat-message-assistant";

        const label =
          role === "user"
            ? "You"
            : "Morena Bakery";

        const strong =
          document.createElement("strong");

        strong.textContent = label;

        const text =
          document.createElement("span");

        text.textContent = message;

        messageElement.appendChild(strong);
        messageElement.appendChild(text);

        chatWindow.appendChild(messageElement);

        chatWindow.scrollTop =
          chatWindow.scrollHeight;
      }

      chatForm.addEventListener(
        "submit",
        async (event) => {
          event.preventDefault();

          const message =
            chatMessageField.value.trim();

          if (!message) {
            return;
          }

          addChatMessage("user", message);

          chatMessageField.value = "";
          chatMessageField.disabled = true;
          chatSubmit.disabled = true;

          chatStatus.textContent =
            "Morena Bakery is typing...";

          try {
            const response =
              await fetch("/api/chat", {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body: JSON.stringify({
                  message,
                }),
              });

            const data =
              await response.json();

            if (!response.ok) {
              throw new Error(
                data?.error ||
                "The chatbot could not respond."
              );
            }

            addChatMessage(
              "assistant",
              data.answer
            );

            chatStatus.textContent = "";
          } catch (error) {
            console.error(error);

            addChatMessage(
              "assistant",
              "Sorry, I could not answer right now. Please try again."
            );

            chatStatus.textContent =
              "There was a problem connecting to the assistant.";
          } finally {
            chatMessageField.disabled = false;
            chatSubmit.disabled = false;

            chatMessageField.focus();
          }
        }
      );
    </script>

  </body>
</html>
