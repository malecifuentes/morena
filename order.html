<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
      name="description"
      content="Place an order request with Morena Bakery."
    >

    <title>Place an Order — Morena Bakery</title>

    <link
      rel="icon"
      type="image/jpeg"
      href="assets/images/logo-morena.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;display=swap"
      rel="stylesheet"
    >

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link href="styles.css" rel="stylesheet">

    <style>
      .order-page {
        margin: 0 auto;
        max-width: 760px;
        padding: clamp(2.5rem, 7vw, 5rem) 1rem;
      }

      .order-page h1 {
        font-size: clamp(2.25rem, 6vw, 4rem);
      }

      .order-intro {
        color: var(--morena-muted);
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 1rem 0 1.25rem;
      }

      .existing-order-link {
        align-items: center;
        color: var(--morena-primary);
        display: inline-flex;
        font-weight: 700;
        gap: 0.45rem;
        margin-bottom: 2.5rem;
        text-decoration: none;
      }

      .existing-order-link:hover {
        color: var(--morena-accent);
      }

      .cart-box,
      .order-form {
        border: 1px solid var(--morena-line);
        background: rgba(255, 255, 255, 0.38);
        padding: clamp(1.5rem, 5vw, 3rem);
      }

      .cart-box {
        margin-bottom: 2rem;
      }

      .cart-title {
        margin-top: 0;
      }

      .cart-empty {
        color: var(--morena-muted);
        margin: 0;
      }

      .cart-item {
        align-items: center;
        border-bottom: 1px solid var(--morena-line);
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr auto;
        padding: 1rem 0;
      }

      .cart-item:last-child {
        border-bottom: 0;
      }

      .cart-item-name {
        color: var(--morena-primary);
        font-weight: 700;
      }

      .cart-item-meta {
        color: var(--morena-muted);
        font-size: 0.95rem;
        margin-top: 0.25rem;
      }

      .cart-actions {
        align-items: center;
        display: flex;
        gap: 0.5rem;
      }

      .cart-actions button {
        background: white;
        border: 1px solid var(--morena-line);
        color: var(--morena-primary);
        cursor: pointer;
        font: inherit;
        min-width: 2.2rem;
        padding: 0.45rem 0.65rem;
      }

      .cart-actions button:hover {
        border-color: var(--morena-accent);
      }

      .add-product-area {
        border-top: 1px solid var(--morena-line);
        margin-top: 1.5rem;
        padding-top: 1.5rem;
      }

      .add-product-row {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr 110px;
      }

      .form-field + .form-field {
        margin-top: 1.4rem;
      }

      .form-field label {
        color: var(--morena-primary);
        display: block;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .form-field input,
      .form-field select {
        background: white;
        border: 1px solid var(--morena-line);
        border-radius: 0;
        box-sizing: border-box;
        color: var(--morena-ink);
        font: inherit;
        padding: 0.8rem 0.9rem;
        width: 100%;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: var(--morena-accent);
        box-shadow: 0 0 0 0.2rem rgba(200, 155, 109, 0.25);
        outline: none;
      }

      .secondary-button,
      .submit-button {
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0.9rem 1.5rem;
      }

      .secondary-button {
        background: var(--morena-accent);
        color: white;
        margin-top: 1rem;
      }

      .secondary-button:hover {
        opacity: 0.9;
      }

      .submit-button {
        background: var(--morena-primary);
        color: white;
        margin-top: 2rem;
      }

      .submit-button:hover {
        background: var(--morena-accent);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .form-message {
        margin: 1.5rem 0 0;
        padding: 1rem;
      }

      .form-message.success {
        border: 1px solid var(--morena-accent);
        color: var(--morena-primary);
      }

      .form-message.error {
        border: 1px solid #a32929;
        color: #8a1f1f;
      }

      .order-code {
        display: block;
        font-family: "Libre Baskerville", serif;
        font-size: 1.35rem;
        font-weight: 700;
        margin-top: 0.75rem;
      }

      .status-link {
        background: var(--morena-primary);
        color: white;
        display: inline-block;
        font-weight: 700;
        margin-top: 1.25rem;
        padding: 0.85rem 1.25rem;
        text-decoration: none;
      }

      .status-link:hover {
        background: var(--morena-accent);
      }

      @media (max-width: 560px) {
        .add-product-row {
          grid-template-columns: 1fr;
        }

        .cart-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>

    <header class="site-header">
      <div
        class="page-width"
        style="margin: 0 auto; padding: 0 1rem;"
      >
        <a
          class="brand"
          href="./"
          aria-label="Morena Bakery catalogue"
        >
          <img
            src="assets/images/logo-morena.jpg"
            alt="Morena Bakery"
          >
        </a>
      </div>
    </header>

    <main class="order-page">

      <a class="back-link" href="./">
        <i
          class="bi bi-arrow-left"
          aria-hidden="true"
        ></i>
        Back to catalogue
      </a>

      <p
        class="eyebrow"
        style="margin-top: 2.5rem;"
      >
        Made especially for you
      </p>

      <h1>Place an order</h1>

      <p class="order-intro">
        Add one or more products to your order and tell us
        when you need them. We’ll contact you to confirm your request.
      </p>

      <a
        class="existing-order-link"
        href="order-status.html"
      >
        <i
          class="bi bi-search"
          aria-hidden="true"
        ></i>
        Already placed an order? Check its status
      </a>

      <section class="cart-box">

        <h2 class="cart-title">
          Your order
        </h2>

        <div id="cart-items"></div>

        <p
          id="cart-empty"
          class="cart-empty"
        >
          Your order is empty. Add a product below.
        </p>

        <div class="add-product-area">

          <div class="add-product-row">

            <div class="form-field">
              <label for="product">
                Product
              </label>

              <select
                id="product"
                name="product"
              >
                <option value="">
                  Choose a product
                </option>

              </select>
            </div>

            <div class="form-field">
              <label for="quantity">
                Quantity
              </label>

              <input
                id="quantity"
                name="quantity"
                type="number"
                min="1"
                max="12"
                step="1"
                value="1"
              >
            </div>

          </div>

          <button
            id="add-product-button"
            class="secondary-button"
            type="button"
          >
            Add to order
          </button>

        </div>

      </section>

      <form
        id="order-form"
        class="order-form"
      >

        <div class="form-field">
          <label for="customer_name">
            Customer name
          </label>

          <input
            id="customer_name"
            name="customer_name"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
          >
        </div>

        <div class="form-field">
          <label for="phone">
            Phone
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            maxlength="20"
            required
          >
        </div>

        <div class="form-field">
          <label for="delivery_date">
            Delivery date
          </label>

          <input
            id="delivery_date"
            name="delivery_date"
            type="date"
            required
          >
        </div>

        <button
          id="submit-button"
          class="submit-button"
          type="submit"
        >
          Review order
        </button>

      </form>

      <section id="order-review" class="order-form" aria-labelledby="review-title" hidden>
        <h2 id="review-title" tabindex="-1">Review your order</h2>
        <div id="review-details"></div>
        <button id="edit-order" class="secondary-button" type="button">Edit order</button>
        <button id="confirm-order" class="submit-button" type="button">Confirm order</button>
      </section>

        <div
          id="form-message"
          class="form-message"
          role="status"
          aria-live="polite"
          hidden
        ></div>

    </main>

    <script type="module">

      const form =
        document.querySelector("#order-form");

      const submitButton =
        document.querySelector("#submit-button");

      const message =
        document.querySelector("#form-message");

      const productField =
        document.querySelector("#product");

      const quantityField =
        document.querySelector("#quantity");

      const deliveryDate =
        document.querySelector("#delivery_date");

      const addProductButton =
        document.querySelector("#add-product-button");

      const cartItemsContainer =
        document.querySelector("#cart-items");

      const cartEmptyMessage =
        document.querySelector("#cart-empty");

      let cart = [];

      const params =
        new URLSearchParams(window.location.search);

      const selectedProduct =
        params.get("product");

      const selectedQuantity =
        Number(params.get("quantity"));

      try {
        const response = await fetch("data/products.json");
        if (!response.ok) throw new Error("Catalogue unavailable");
        const products = await response.json();
        for (const product of products.filter((item) => item.bakery === "Morena" && item.available)) {
          productField.add(new Option(product.name, product.name));
        }
      } catch {
        message.hidden = false;
        message.className = "form-message error";
        message.textContent = "Products could not be loaded. Please reload the page to try again.";
        addProductButton.disabled = true;
        submitButton.disabled = true;
      }

      if (selectedProduct) {
        const productExists =
          Array.from(productField.options).some(
            (option) =>
              option.value === selectedProduct
          );

        if (productExists) {
          cart.push({
            product: selectedProduct,
            quantity:
              Number.isInteger(selectedQuantity) &&
              selectedQuantity >= 1 &&
              selectedQuantity <= 12
                ? selectedQuantity
                : 1,
          });
        }
      }

      const tomorrow = new Date();

      tomorrow.setDate(
        tomorrow.getDate() + 1
      );

      deliveryDate.min =
        [tomorrow.getFullYear(), String(tomorrow.getMonth() + 1).padStart(2, "0"), String(tomorrow.getDate()).padStart(2, "0")].join("-");

      function renderCart() {

        cartItemsContainer.innerHTML = "";

        cartEmptyMessage.hidden =
          cart.length > 0;

        cart.forEach(
          (item, index) => {

            const itemElement =
              document.createElement("div");

            itemElement.className =
              "cart-item";

            itemElement.innerHTML = `
              <div>
                <div class="cart-item-name">
                  ${escapeHtml(item.product)}
                </div>

                <div class="cart-item-meta">
                  Quantity: ${item.quantity}
                </div>
              </div>

              <div class="cart-actions">
                <button
                  type="button"
                  data-action="decrease"
                  data-index="${index}"
                  aria-label="Decrease quantity"
                >
                  −
                </button>

                <button
                  type="button"
                  data-action="increase"
                  data-index="${index}"
                  aria-label="Increase quantity"
                >
                  +
                </button>

                <button
                  type="button"
                  data-action="remove"
                  data-index="${index}"
                  aria-label="Remove product"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            `;

            cartItemsContainer.appendChild(
              itemElement
            );
          }
        );
      }

      function addProductToCart() {

        const product =
          productField.value;

        const quantity =
          Number(quantityField.value);

        if (!product) {
          alert("Please choose a product.");
          return;
        }

        if (
          !Number.isInteger(quantity) ||
          quantity < 1 ||
          quantity > 12
        ) {
          alert(
            "Quantity must be between 1 and 12."
          );

          return;
        }

        const existingItem =
          cart.find(
            (item) =>
              item.product === product
          );

        if (existingItem) {
          existingItem.quantity =
            Math.min(
              12,
              existingItem.quantity +
                quantity
            );
        } else {
          cart.push({
            product,
            quantity,
          });
        }

        productField.value = "";
        quantityField.value = "1";

        renderCart();
      }

      addProductButton.addEventListener(
        "click",
        addProductToCart
      );

      cartItemsContainer.addEventListener(
        "click",
        (event) => {

          const button =
            event.target.closest(
              "button[data-action]"
            );

          if (!button) {
            return;
          }

          const index =
            Number(button.dataset.index);

          const action =
            button.dataset.action;

          if (!cart[index]) {
            return;
          }

          if (action === "increase") {
            cart[index].quantity =
              Math.min(
                12,
                cart[index].quantity + 1
              );
          }

          if (action === "decrease") {
            cart[index].quantity -= 1;

            if (
              cart[index].quantity < 1
            ) {
              cart.splice(index, 1);
            }
          }

          if (action === "remove") {
            cart.splice(index, 1);
          }

          renderCart();
        }
      );

      const review = document.querySelector("#order-review");
      const reviewDetails = document.querySelector("#review-details");
      const editButton = document.querySelector("#edit-order");
      const confirmButton = document.querySelector("#confirm-order");
      const cartBox = document.querySelector(".cart-box");
      let reviewedOrder = null;
      let sending = false;
      let completed = false;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (sending || completed || !form.reportValidity()) return;
        const formData = new FormData(form);
        const customerName = formData.get("customer_name").trim();
        const phone = formData.get("phone").trim();
        if (!cart.length || !customerName || !phone) {
          message.hidden = false;
          message.className = "form-message error";
          message.textContent = "Add at least one product and enter your name and phone number.";
          return;
        }
        reviewedOrder = {
          items: cart.map(({ product, quantity }) => ({ product, quantity })),
          customer_name: customerName,
          phone,
          delivery_date: formData.get("delivery_date"),
        };
        reviewDetails.innerHTML = `
          <ul>${reviewedOrder.items.map((item) => `<li>${escapeHtml(item.product)} — Quantity: ${item.quantity}</li>`).join("")}</ul>
          <p><strong>Customer name:</strong> ${escapeHtml(reviewedOrder.customer_name)}</p>
          <p><strong>Phone:</strong> ${escapeHtml(reviewedOrder.phone)}</p>
          <p><strong>Delivery date:</strong> ${escapeHtml(reviewedOrder.delivery_date)}</p>
          <p>Morena Bakery will contact you to confirm your request.</p>
        `;
        message.hidden = true;
        form.hidden = true;
        cartBox.hidden = true;
        review.hidden = false;
        document.querySelector("#review-title").focus();
      });

      editButton.addEventListener("click", () => {
        if (sending || completed) return;
        reviewedOrder = null;
        review.hidden = true;
        form.hidden = false;
        cartBox.hidden = false;
        message.hidden = true;
        document.querySelector("#customer_name").focus();
      });

      confirmButton.addEventListener("click", async () => {
        if (sending || completed || !reviewedOrder) return;
        sending = true;
        confirmButton.disabled = true;
        editButton.disabled = true;
        confirmButton.textContent = "Sending…";
        message.hidden = true;
        try {
          const response = await fetch("/api/order-request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(reviewedOrder),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(typeof result.error === "string" ? result.error : "The order could not be saved.");
          }
          const order = result.order;
          if (!result.success || !order?.order_code || !order?.status) {
            throw new Error("The service did not return a folio and status. Contact Morena Bakery before retrying.");
          }
          // Render only the creation response: no order lookup or database read.
          message.className = "form-message success";
          message.innerHTML = `
            <h2 tabindex="-1" id="confirmation-title">Your order was received successfully!</h2>
            <span class="order-code">Order folio: ${escapeHtml(order.order_code)}</span>
            <p>Status: ${escapeHtml(order.status)}</p>
            <p>Please save your order folio to check its status later.</p>
            <a class="status-link" href="order-status.html?order_code=${encodeURIComponent(order.order_code)}">Check Order Status</a>
          `;
          completed = true;
          review.hidden = true;
          message.hidden = false;
          document.querySelector("#confirmation-title").focus();
        } catch (error) {
          message.className = "form-message error";
          message.textContent = error.message || "The service could not confirm your order. Contact Morena Bakery before retrying.";
          message.hidden = false;
        } finally {
          sending = false;
          confirmButton.disabled = completed;
          editButton.disabled = completed;
          confirmButton.textContent = "Confirm order";
        }
      });

      renderCart();

    </script>

  </body>
</html>
