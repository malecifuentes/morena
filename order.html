<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
      name="description"
      content="Place an order request with Morena Bakery."
    >

    <title>Place an Order — Morena Bakery</title>

    <link
      rel="icon"
      type="image/jpeg"
      href="assets/images/logo-morena.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;display=swap"
      rel="stylesheet"
    >

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link href="styles.css" rel="stylesheet">

    <style>
      .order-page {
        margin: 0 auto;
        max-width: 720px;
        padding-top: clamp(2.5rem, 7vw, 5rem);
      }

      .order-page h1 {
        font-size: clamp(2.25rem, 6vw, 4rem);
      }

      .order-intro {
        color: var(--morena-muted);
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 1rem 0 2.5rem;
      }

      .order-form {
        border: 1px solid var(--morena-line);
        background: rgba(255, 255, 255, 0.38);
        padding: clamp(1.5rem, 5vw, 3rem);
      }

      .form-field + .form-field {
        margin-top: 1.4rem;
      }

      .form-field label {
        color: var(--morena-primary);
        display: block;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .form-field input,
      .form-field select {
        background: white;
        border: 1px solid var(--morena-line);
        border-radius: 0;
        box-sizing: border-box;
        color: var(--morena-ink);
        font: inherit;
        padding: 0.8rem 0.9rem;
        width: 100%;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: var(--morena-accent);
        box-shadow: 0 0 0 0.2rem rgba(200, 155, 109, 0.25);
        outline: none;
      }

      .submit-button {
        background: var(--morena-primary);
        border: 0;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 2rem;
        padding: 0.9rem 1.5rem;
      }

      .submit-button:hover {
        background: var(--morena-accent);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .form-message {
        margin: 1.5rem 0 0;
        padding: 1rem;
      }

      .form-message.success {
        border: 1px solid var(--morena-accent);
        color: var(--morena-primary);
      }

      .form-message.error {
        border: 1px solid #a32929;
        color: #8a1f1f;
      }
    </style>
  </head>

  <body>

    <header class="site-header">
      <div
        class="page-width"
        style="margin: 0 auto; padding: 0 1rem;"
      >
        <a
          class="brand"
          href="./"
          aria-label="Morena Bakery catalogue"
        >
          <img
            src="assets/images/logo-morena.jpg"
            alt="Morena Bakery"
          >
        </a>
      </div>
    </header>

    <main class="order-page">

      <a class="back-link" href="./">
        <i
          class="bi bi-arrow-left"
          aria-hidden="true"
        ></i>
        Back to catalogue
      </a>

      <p
        class="eyebrow"
        style="margin-top: 2.5rem;"
      >
        Made especially for you
      </p>

      <h1>Place an order</h1>

      <p class="order-intro">
        Tell us what you would like and when you need it.
        We’ll contact you to confirm your order.
      </p>

      <form
        id="order-form"
        class="order-form"
      >

        <div class="form-field">
          <label for="product">
            Product
          </label>

          <select
            id="product"
            name="product"
            required
          >
            <option value="">
              Choose a product
            </option>

            <option value="Red Velvet Heart Cake">
              Red Velvet Heart Cake
            </option>

            <option value="Box of 6 Cupcakes">
              Box of 6 Cupcakes
            </option>

            <option value="Banana Bread">
              Banana Bread
            </option>
          </select>
        </div>

        <div class="form-field">
          <label for="quantity">
            Quantity
          </label>

          <input
            id="quantity"
            name="quantity"
            type="number"
            min="1"
            max="12"
            step="1"
            value="1"
            required
          >
        </div>

        <div class="form-field">
          <label for="customer_name">
            Customer name
          </label>

          <input
            id="customer_name"
            name="customer_name"
            type="text"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-field">
          <label for="phone">
            Phone
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-field">
          <label for="delivery_date">
            Delivery date
          </label>

          <input
            id="delivery_date"
            name="delivery_date"
            type="date"
            required
          >
        </div>

        <button
          id="submit-button"
          class="submit-button"
          type="submit"
        >
          Send order request
        </button>

        <p
          id="form-message"
          class="form-message"
          role="status"
          aria-live="polite"
          hidden
        ></p>

      </form>

    </main>

    <script>

      const form =
        document.querySelector("#order-form");

      const submitButton =
        document.querySelector("#submit-button");

      const message =
        document.querySelector("#form-message");

      const productField =
        document.querySelector("#product");

      const quantityField =
        document.querySelector("#quantity");

      const deliveryDate =
        document.querySelector("#delivery_date");

      const params =
        new URLSearchParams(window.location.search);

      const selectedProduct =
        params.get("product");

      const selectedQuantity =
        Number(params.get("quantity"));

      if (selectedProduct) {
        const productExists =
          Array.from(productField.options).some(
            (option) =>
              option.value === selectedProduct
          );

        if (productExists) {
          productField.value =
            selectedProduct;
        }
      }

      if (
        Number.isInteger(selectedQuantity) &&
        selectedQuantity >= 1 &&
        selectedQuantity <= 12
      ) {
        quantityField.value =
          selectedQuantity;
      }

      const tomorrow = new Date();

      tomorrow.setDate(
        tomorrow.getDate() + 1
      );

      deliveryDate.min =
        tomorrow.toLocaleDateString("en-CA");

      form.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();

          submitButton.disabled = true;
          submitButton.textContent =
            "Sending…";

          message.hidden = true;
          message.className =
            "form-message";

          const formData =
            new FormData(form);

          const orderRequest = {
            product:
              formData.get("product"),

            quantity:
              Number(
                formData.get("quantity")
              ),

            customer_name:
              formData.get(
                "customer_name"
              ),

            phone:
              formData.get("phone"),

            delivery_date:
              formData.get(
                "delivery_date"
              ),
          };

          let error = null;

          try {
            const apiResponse = await fetch(
              "/api/order-request",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(
                  orderRequest
                ),
              }
            );

            const result =
              await apiResponse.json();

            if (!apiResponse.ok) {
              const details =
                result.error;

              error = {
                message:
                  typeof details === "string"
                    ? details
                    : details?.message ||
                      JSON.stringify(
                        details
                      ),
              };
            }
          } catch (requestError) {
            error = {
              message:
                requestError instanceof Error
                  ? requestError.message
                  : String(requestError),
            };
          }

          message.hidden = false;

          if (error) {
            message.classList.add(
              "error"
            );

            message.textContent =
              `Your order could not be saved: ${error.message}`;

            submitButton.disabled =
              false;

            submitButton.textContent =
              "Send order request";

            return;
          }

          message.classList.add(
            "success"
          );

          message.textContent =
            "Thank you! Your order request has been saved.";

          submitButton.textContent =
            "Order request sent";
        }
      );

    </script>

  </body>
</html>
